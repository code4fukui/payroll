<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ログイン | 稼働状況ダッシュボード</title><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><div class="brand"><span>TIME CARD</span><h1>稼働状況<br>ダッシュボード</h1><p>登録されたメンバー専用ページです。</p></div><section class="auth-card"><div class="tabs"><button class="tab active" data-tab="login">ログイン</button><button class="tab" data-tab="register">新規登録</button></div><form id="login-form" class="auth-form"><h2>ログイン</h2><p class="hint">登録した名前とパスキーでログインします。</p><label>名前<input name="name" required autocomplete="username"></label><button class="primary" type="submit">パスキーでログイン</button></form><form id="register-form" class="auth-form hidden"><h2>新規登録</h2><p class="hint">登録後、管理者の承認が完了すると利用できます。</p><label>名前<input name="name" required autocomplete="name"></label><label>合言葉<input name="passphrase" type="password" minlength="8" required autocomplete="new-password"><small>8文字以上</small></label><button class="primary" type="submit">パスキーを登録</button></form><p id="message" class="message" aria-live="polite"></p></section></main><script src="auth.js"></script></body></html>
